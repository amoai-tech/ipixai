# IPI-1200 · PR-REVIEW-V2-001
# Keep this file intentionally small. Upstream defaults remain authoritative unless overridden here.

[config]
model = "nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b"
fallback_models = ["nvidia_nim/nvidia/nemotron-3.5-lightning-30b-a3b"]
custom_model_max_tokens = 32000
repo_context_files = ["AGENTS.md", "docs/pr-review-guidelines.md"]
repo_context_from_default_branch = true
repo_context_max_lines = 500
restricted_mode = true
output_run_details = true

[skills]
enabled = false

[pr_reviewer]
require_score_review = true
require_tests_review = true
require_security_review = true
require_ticket_analysis_review = false
require_risk_assessment = true
require_merge_recommendation = true
require_priority_files = true
persistent_comment = true
persistent_finding_state = false
num_max_findings = 6
enable_large_pr_chunking = true
max_number_of_calls = 3
extra_instructions = """
Prioritize correctness, tenant/authorization safety, data integrity, consequential AI/HITL safety, regression risk, and missing deterministic proof.
Do not publish style-only findings as material issues. A numeric score never overrides a security, tenant-isolation, data-loss, payment, publishing, or approval-integrity blocker.
For each HIGH/BLOCKER finding identify the changed code, realistic failure trigger, impact, evidence/invariant, smallest safe fix, and verification needed.
"""
