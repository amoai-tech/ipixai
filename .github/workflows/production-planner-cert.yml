name: Production Planner Certification

# IPI-1332 / IPI-1091 — certify a previously promoted SHA. Paid model calls
# and durable synthetic QA threads are explicitly authorized in IPI-1091.
# This workflow never stages, promotes, or creates a Vercel deployment.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact 40-character Git SHA already serving Production
        required: true
        type: string
      confirm:
        description: Type certify-production to accept paid calls and persistent QA thread
        required: true
        type: string

permissions:
  contents: read

# CI's vercel-production job uses this exact group for staged Planner QA.
# Hold it for the entire certification (including logs), not just the browser.
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  # No checked-out candidate code or npm lifecycle scripts run on this runner.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: Production
      deployment: false
    outputs:
      expected_sha: ${{ steps.request.outputs.expected_sha }}
      deployment_url: ${{ steps.prod.outputs.deployment_url }}
      deployment_sha: ${{ steps.prod.outputs.deployment_sha }}
      deployment_id: ${{ steps.prod.outputs.deployment_id }}
    steps:
      - name: Validate the request
        id: request
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::expected_sha must be an exact 40-character Git SHA" >&2
            exit 1
          fi
          if [ "$CONFIRM" != "certify-production" ]; then
            echo "::error::type certify-production to authorize paid QA and a persisted synthetic Planner thread" >&2
            exit 1
          fi
          echo "expected_sha=$(printf '%s' "$EXPECTED_SHA" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted workflow revision for policy checks
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert the SHA is a released commit on main
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" origin/main; then
            echo "::error::SHA is not a released commit on main" >&2
            exit 1
          fi

      - name: Verify required Production environment reviewers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-production-environment.mjs

      - name: Install pinned Vercel CLI on credential-only runner
        run: npm install --global vercel@59.23.1

      - name: Assert Production serves the expected SHA
        id: prod
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_PROJECT_ID"
          vercel ls "$VERCEL_PROJECT_ID" --prod --json --token="$VERCEL_TOKEN" > /tmp/prod.json
          vercel inspect https://www.ipix.co --json --token="$VERCEL_TOKEN" > /tmp/alias.json
          node - <<'JS'
          const fs = require("node:fs");
          const list = JSON.parse(fs.readFileSync("/tmp/prod.json", "utf8"));
          const alias = JSON.parse(fs.readFileSync("/tmp/alias.json", "utf8"));
          const deployments = (list.deployments || list).filter(d => d.target === "production");
          const live = deployments.find(d => d.url === alias.url);
          if (!live || live.meta?.githubCommitSha !== process.env.EXPECTED_SHA ||
              alias.target !== "production" || alias.readyState !== "READY" || !alias.id) {
            throw new Error("www.ipix.co is not the expected READY Production deployment");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `deployment_url=${live.url}\ndeployment_sha=${live.meta.githubCommitSha}\ndeployment_id=${alias.id}\n`);
          console.log(`Verified alias: www.ipix.co -> ${live.url} (${live.meta.githubCommitSha})`);
          JS

  # Candidate npm scripts and browser tests never receive the Vercel token.
  certify:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CERT_TRACE_FILE: ${{ github.workspace }}/test-results/planner-cert-trace.json
    outputs:
      started_at: ${{ steps.journey.outputs.started_at }}
    steps:
      - name: Checkout the certified SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.verify.outputs.expected_sha }}
          persist-credentials: false

      - name: Use repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium

      - name: Run the signed-in Production Planner certification
        id: journey
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COPILOTKIT_TELEMETRY_DISABLED: "true"
        run: |
          set -euo pipefail
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          npm run e2e:production-cert

      # This contains only UUID thread identifiers and a first-request timestamp,
      # never browser traces, session tokens, prompts or model output.
      - name: Upload bounded certification trace
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: planner-cert-trace
          path: test-results/planner-cert-trace.json
          if-no-files-found: error
          retention-days: 1

  # The token-bearing log check runs on a new runner. No candidate SHA is ever
  # checked out or installed here; repository source comes from reviewed main.
  logs:
    needs: [verify, certify]
    if: ${{ always() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      deployment: false
    env:
      CERT_TRACE_FILE: ${{ github.workspace }}/test-results/planner-cert-trace.json
      PROD_LOG_FILE: /tmp/prod-logs.jsonl
      PROD_LOG_LIMIT: "5000"
      CERT_STARTED_AT: ${{ needs.certify.outputs.started_at }}
      DEPLOYMENT_URL: ${{ needs.verify.outputs.deployment_url }}
      DEPLOYMENT_ID: ${{ needs.verify.outputs.deployment_id }}
      EXPECTED_SHA: ${{ needs.verify.outputs.expected_sha }}
    steps:
      - name: Checkout trusted workflow revision for log parser
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify required Production environment reviewers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-production-environment.mjs

      - name: Install pinned Vercel CLI on credential-only runner
        run: npm install --global vercel@59.23.1

      - name: Download certification thread identifiers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: planner-cert-trace
          path: test-results

      - name: Recheck alias and deployment after the Planner journey
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_PROJECT_ID"
          vercel ls "$VERCEL_PROJECT_ID" --prod --json --token="$VERCEL_TOKEN" > /tmp/prod-after.json
          vercel inspect https://www.ipix.co --json --token="$VERCEL_TOKEN" > /tmp/alias-after.json
          node - <<'JS'
          const fs = require("node:fs");
          const list = JSON.parse(fs.readFileSync("/tmp/prod-after.json", "utf8"));
          const alias = JSON.parse(fs.readFileSync("/tmp/alias-after.json", "utf8"));
          const deployments = (list.deployments || list).filter(d => d.target === "production");
          const live = deployments.find(d => d.url === alias.url);
          if (!live || live.url !== process.env.DEPLOYMENT_URL ||
              live.meta?.githubCommitSha !== process.env.EXPECTED_SHA ||
              alias.target !== "production" || alias.readyState !== "READY" ||
              alias.id !== process.env.DEPLOYMENT_ID) {
            throw new Error("Production alias/deployment changed during certification; refuse to certify mixed traffic");
          }
          console.log("Post-journey live alias, SHA and deployment ID unchanged");
          JS

      - name: Fetch bounded immutable-deployment logs
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_STARTED_AT:-}" ]; then
            echo "::error::Certification window start missing; cannot certify logs" >&2
            exit 1
          fi
          vercel logs "$DEPLOYMENT_URL" --json \
            --since "$CERT_STARTED_AT" \
            --until "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --limit "$PROD_LOG_LIMIT" \
            --token="$VERCEL_TOKEN" > "$PROD_LOG_FILE"

      # Deliberately omit VERCEL_TOKEN: the parser is the only repo script
      # that consumes log output, and cannot access deployment credentials.
      - name: Assert no unexpected /api/copilotkit 5xx on the live deployment
        run: node scripts/check-planner-production-logs.mjs

      - name: Certification summary
        if: always()
        run: |
          {
            echo "### Production Planner certification"
            echo "| Field | Value |"
            echo "| -- | -- |"
            echo "| Requested SHA | \`${{ needs.verify.outputs.expected_sha }}\` |"
            echo "| Deployment | \`${{ needs.verify.outputs.deployment_url }}\` |"
            echo "| Deployment ID | \`${{ needs.verify.outputs.deployment_id }}\` |"
            echo "| Browser QA outcome | \`${{ needs.certify.result }}\` |"
            echo "| Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
