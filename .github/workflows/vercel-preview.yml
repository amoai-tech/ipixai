name: Vercel Exact-SHA Preview

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character Git SHA to certify
        required: true
        type: string
      branch:
        description: Source branch for branch-scoped Preview environment variables
        required: true
        type: string

permissions:
  contents: read

# The certified Planner spec list — the single source of truth for what this
# workflow runs. The "Assert the running workflow matches the candidate SHA"
# step reads this exact list from BOTH the running copy and the candidate SHA's
# copy and fails if they differ, so a stale dispatch ref can no longer certify a
# PR's code against a different (usually older) spec list.
env:
  CERT_SPECS: |
    e2e/planner-stop-journey.spec.ts
    e2e/planner-journey.spec.ts
    e2e/planner-thread-isolation.spec.ts
    e2e/planner-workflows.spec.ts

concurrency:
  group: vercel-preview-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  build:
    # Workflow code and Vercel credentials must come from protected main,
    # even when the exact candidate commit comes from a PR branch.
    if: github.ref == 'refs/heads/main'
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact requested SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify SHA belongs to declared branch
        shell: bash
        env:
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          if [[ ! "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "sha must be an exact 40-character Git SHA" >&2
            exit 1
          fi
          git check-ref-format --branch "$BRANCH" >/dev/null
          git fetch --no-tags origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git merge-base --is-ancestor "$SHA" "origin/$BRANCH"

      # IPI-1332 · CERT-INTEGRITY-001: the workflow must come from trusted
      # main, while checkout uses the exact candidate SHA. Compare the
      # certified spec list from both revisions and fail if they differ:
      # neither an old main workflow nor candidate changes may silently
      # remove a journey. Never use --ref on the candidate branch in a
      # credential-bearing workflow.
      - name: Assert the running workflow matches the candidate SHA
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
          RUNNING_REF_SHA: ${{ github.sha }}
          RUNNING_REF: ${{ github.ref }}
          WORKFLOW_PATH: .github/workflows/vercel-preview.yml
        run: |
          set -euo pipefail

          # Spec paths may contain uppercase, underscores and sub-directories
          # (`e2e/agents/seed.spec.ts` already exists), so the pattern must accept
          # any non-whitespace path character. A narrower class silently DROPS a
          # spec from both sides of the comparison *and* from the run below, which
          # is the silent-narrowing failure this workflow exists to prevent.
          spec_path_pattern='e2e/[A-Za-z0-9_./-]+\.spec\.ts'

          # Read the declared list from the `CERT_SPECS:` block ONLY. Grepping
          # the whole file would also match a spec path that appears in a
          # comment, so a merely-documented spec could be treated as declared and
          # the comparison below could pass while that spec never runs.
          cert_specs_block_of() {
            sed -n '/^[[:space:]]*CERT_SPECS:[[:space:]]*|/,/^[^[:space:]]/p' "$1"
          }

          cert_specs_of() {
            cert_specs_block_of "$1" | grep -oE "$spec_path_pattern" | sort -u
          }

          # Independent of the pattern above: any declared line naming a spec that
          # the pattern cannot extract would be dropped from BOTH sides, so the
          # comparison would pass while that spec never runs. Fail loudly instead.
          assert_every_declared_spec_is_extractable() {
            local stray
            stray="$(cert_specs_block_of "$1" | grep -E '\.spec\.ts' | grep -vE "$spec_path_pattern" || true)"
            if [ -n "$stray" ]; then
              echo "::error::$1 declares a spec path this workflow cannot extract (spec_path_pattern=${spec_path_pattern}): ${stray}" >&2
              exit 1
            fi
          }

          # The workspace copy is the CANDIDATE SHA's (actions/checkout used
          # `ref: inputs.sha`): this is the list the candidate intends to run.
          assert_every_declared_spec_is_extractable "$WORKFLOW_PATH"
          mapfile -t candidate < <(cert_specs_of "$WORKFLOW_PATH")

          # The RUNNING file is the one GitHub compiled into this job, i.e. the
          # dispatch ref's copy. Fetch that ref so the dispatched commit's
          # objects are present, then read the exact commit GitHub dispatched on.
          git fetch --no-tags origin "$RUNNING_REF"
          git show "$RUNNING_REF_SHA:$WORKFLOW_PATH" > /tmp/running-workflow.yml
          assert_every_declared_spec_is_extractable /tmp/running-workflow.yml
          mapfile -t running < <(cert_specs_of /tmp/running-workflow.yml)

          echo "Certified spec list — running workflow (${RUNNING_REF} @ ${RUNNING_REF_SHA}):"
          printf '  %s\n' "${running[@]}"
          echo "Certified spec list — candidate SHA   (${CANDIDATE_SHA}):"
          printf '  %s\n' "${candidate[@]}"

          if [ "${#candidate[@]}" -eq 0 ]; then
            echo "::error::${CANDIDATE_SHA} declares no certified specs in the ${WORKFLOW_PATH} CERT_SPECS block. Certify a commit that carries this declaration (any commit at or after the one that introduced CERT_SPECS)." >&2
            exit 1
          fi
          for spec in "${candidate[@]}"; do
            if [ ! -f "$spec" ]; then
              echo "::error::${spec} is declared by ${CANDIDATE_SHA} but missing from that commit" >&2
              exit 1
            fi
          done

          if [ "${#running[@]}" -eq 0 ]; then
            echo "::error::the workflow that ran (${RUNNING_REF} @ ${RUNNING_REF_SHA}) has no CERT_SPECS block, so its certified list cannot be verified. Update the reviewed spec list on main, then dispatch with --ref main." >&2
            exit 1
          fi

          if [ "${running[*]}" != "${candidate[*]}" ]; then
            echo "::error title=Certifying a different spec list than the candidate declares::the workflow that ran came from ${RUNNING_REF} (${RUNNING_REF_SHA}), but ${CANDIDATE_SHA} declares a different spec list. Update the reviewed spec list on main, then dispatch with --ref main; never dispatch from the candidate branch." >&2
            exit 1
          fi
          echo "OK: ${#candidate[@]} spec file(s) — running workflow equals the candidate SHA's declared list."

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.23.1

      - name: Pull branch-scoped Preview environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          BRANCH: ${{ inputs.branch }}
        run: >-
          vercel pull --yes --environment=preview
          --git-branch="$BRANCH"

      - name: Build exact SHA Preview artifact
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel build

      - name: Pack compiled artifact without Vercel environment files
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/output/config.json
          test -f .vercel/project.json
          if find .vercel/output -type f -name '.env*' | grep -q .; then
            echo "::error::Refusing to upload a build containing a .env file"
            exit 1
          fi
          tar -C .vercel -czf "$RUNNER_TEMP/ipix-prebuilt.tar.gz" output project.json

      - name: Upload compiled artifact for isolated deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ipix-prebuilt-${{ inputs.sha }}
          path: ${{ runner.temp }}/ipix-prebuilt.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    # A fresh runner with no candidate checkout or build scripts. Candidate
    # code cannot alter PATH/GITHUB_ENV before this job receives Vercel access.
    # A second protected job is needed so an environment-scoped VERCEL_TOKEN
    # remains available after removing its repository-wide copy.
    needs: build
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      url: ${{ steps.verify.outputs.origin }}
    steps:
      - name: Use Node.js 24 for pinned Vercel CLI
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Download compiled Preview artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ipix-prebuilt-${{ inputs.sha }}
          path: ${{ runner.temp }}

      - name: Restore only Vercel build output and project linkage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          tar -xzf "$RUNNER_TEMP/ipix-prebuilt.tar.gz" -C .vercel
          test -f .vercel/output/config.json
          test -f .vercel/project.json

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.23.1

      - name: Deploy exact SHA Preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          SHA: ${{ inputs.sha }}
          BRANCH: ${{ inputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --meta githubCommitSha="$SHA" --meta githubCommitRef="$BRANCH")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify exact READY Preview ownership before QA
        id: verify
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SHA: ${{ inputs.sha }}
          EXPECTED_BRANCH: ${{ inputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          # Inline, fixed workflow logic only: never import candidate files
          # or run candidate scripts on a credential-bearing runner.
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const value = process.env.DEPLOYMENT_URL;
          const url = new URL(value);
          if (url.protocol !== "https:" || url.origin !== value ||
              !/^ipixai-[a-z0-9-]+-amo-agency[.]vercel[.]app$/i.test(url.hostname)) {
            throw new Error("Expected unique, canonical amo-agency Preview URL");
          }
          const endpoint = new URL("https://api.vercel.com/v13/deployments/" +
            encodeURIComponent(url.hostname));
          endpoint.searchParams.set("teamId", process.env.VERCEL_ORG_ID);
          const response = await fetch(endpoint, {
            headers: { Authorization: "Bearer " + process.env.VERCEL_TOKEN },
            signal: AbortSignal.timeout(15000),
          });
          if (!response.ok) throw new Error("Preview ownership API HTTP " + response.status);
          const data = await response.json();
          if (data.url !== url.hostname ||
              data.projectId !== process.env.VERCEL_PROJECT_ID ||
              data.readyState !== "READY" ||
              data.target === "production" ||
              data.meta?.githubCommitSha !== process.env.EXPECTED_SHA ||
              data.meta?.githubCommitRef !== process.env.EXPECTED_BRANCH) {
            throw new Error("Preview ownership, READY status, or commit identity mismatch");
          }
          appendFileSync(process.env.GITHUB_OUTPUT, "origin=" + url.origin + "\n");
          console.log("Verified exact SHA, branch, READY status and Vercel project");
          NODE

  journeys:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact candidate SHA for QA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # IPI-1344 · E2E-PREVIEW-BYPASS-001 — certifying a Preview used to depend
      # on single-use Vercel share links, which silently stopped granting access
      # and made the journeys fail on an SSO screen (recorded as a residual risk
      # on IPI-1339). Playwright now clears Deployment Protection with the
      # project's existing VERCEL_AUTOMATION_BYPASS_SECRET, so the real journeys
      # can run here. playwright.config.ts fails closed when a Preview target has
      # no secret.
      - name: Install dependencies for the authenticated journeys
        run: npm ci

      - name: Install Chromium
        run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium

      - name: Run authenticated Planner journeys against this exact Preview
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.url }}
          # A trusted, token-bearing step on a separate runner verified this
          # exact origin with Vercel's API before providing any QA secrets.
          E2E_VERIFIED_PREVIEW_ORIGIN: ${{ needs.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          COPILOTKIT_TELEMETRY_DISABLED: "true"
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_EMAIL_ORG_B: ${{ secrets.E2E_TEST_EMAIL_ORG_B }}
          E2E_TEST_PASSWORD_ORG_B: ${{ secrets.E2E_TEST_PASSWORD_ORG_B }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # IPI-1329: planner-thread-isolation proves Org B cannot list/read
          # Org A's Planner thread on this exact Preview (uses the ORG_B secrets).
          # IPI-1332 PR B: planner-workflows covers the target memory-history
          # contract on the upgraded family -- the plan card survives reload,
          # navigating mid-stream does not duplicate a run, and restored messages
          # appear once.
          # Named specs only: brand-intelligence-journey is deliberately not
          # included because it writes to a hosted brand and must never run
          # against a Preview by accident.
          # `CERT_SPECS` is the workflow-level declared list; the step above has
          # already proved it equals the candidate SHA's own copy of that list.
          #
          # Extract only the spec paths rather than reading every line. A YAML
          # block scalar already ends with a newline and the here-string adds
          # another, so a plain `mapfile -t specs <<< "$CERT_SPECS"` appends an
          # empty element — `${#specs[@]}` would be 5 for 4 declared specs and this
          # step would fail on every run. Verified against the real value.
          #
          # The pattern must match every path the CU block allows (uppercase,
          # underscores, sub-directories), or a declared spec would be dropped
          # here and never run; the assertion step fails loudly in that case.
          spec_path_pattern='e2e/[A-Za-z0-9_./-]+\.spec\.ts'
          mapfile -t specs < <(grep -oE "$spec_path_pattern" <<< "${CERT_SPECS:-}")
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "::error::CERT_SPECS declares no specs; refusing to run an unbounded spec set" >&2
            exit 1
          fi
          # Independent of the pattern: any declared line naming a spec that was
          # not extracted would be silently skipped, so fail loudly instead.
          stray="$(grep -E '\.spec\.ts' <<< "${CERT_SPECS:-}" | grep -vE "$spec_path_pattern" || true)"
          if [ -n "$stray" ]; then
            echo "::error::CERT_SPECS declares a spec path this step cannot extract (spec_path_pattern=${spec_path_pattern}): ${stray}" >&2
            exit 1
          fi
          # Still guard against a first-line-only reader: the declared line count
          # must equal the number of specs handed to Playwright.
          declared="$(grep -cE "$spec_path_pattern" <<< "${CERT_SPECS:-}" || true)"
          if [ "${#specs[@]}" -ne "$declared" ]; then
            echo "::error::expanded ${#specs[@]} spec(s) but ${declared} declared line(s); refusing to run a partial certification" >&2
            exit 1
          fi
          echo "Running ${#specs[@]} certified spec file(s):"
          printf '  %s\n' "${specs[@]}"
          PLAYWRIGHT_BROWSERS_PATH=0 npx playwright test \
            --project=chromium-ai-smoke \
            "${specs[@]}"
