name: Live AI Smoke

on:
  workflow_dispatch:
  schedule:
    # Daily health check, separated from deterministic release CI.
    - cron: "17 11 * * *"

permissions:
  contents: read

concurrency:
  group: live-ai-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-ai-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COPILOTKIT_TELEMETRY_DISABLED: "true"
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_TEST_EMAIL_ORG_B: ${{ secrets.E2E_TEST_EMAIL_ORG_B }}
      E2E_TEST_PASSWORD_ORG_B: ${{ secrets.E2E_TEST_PASSWORD_ORG_B }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
      - run: npm run e2e:ai-smoke
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Authenticated smoke: keep traces/reports runner-local in this public repo.
