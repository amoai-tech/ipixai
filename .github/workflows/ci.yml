name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: placeholder
      COPILOTKIT_TELEMETRY_DISABLED: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  # Playwright E2E — real UI login + tenant-isolation smoke against a local
  # dev server. Requires E2E_TEST_EMAIL / E2E_TEST_PASSWORD (and, for the
  # app itself to authenticate, NEXT_PUBLIC_SUPABASE_URL /
  # NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY) as repo secrets — a maintainer
  # with repo admin must add these; until then this job fails with the
  # harness's own clear "credentials missing" error, not a silent skip.
  # Most IPI-1066-dependent specs are `test.fixme` until
  # https://github.com/amoai-tech/ipixai/pull/52 merges — see e2e/*.spec.ts.
  # e2e/planner-journey.spec.ts makes one real hosted GPT-4o call through
  # productionPlannerAgent — the only spec that does — so this job also
  # needs a real OPENAI_API_KEY secret with usable quota; every other job
  # keeps the "placeholder" literal since nothing else calls OpenAI for real.
  # The real key is scoped to only the `npm run e2e` step below (least
  # privilege) — checkout/setup-node/npm ci/browser install/artifact upload
  # never see it.
  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COPILOTKIT_TELEMETRY_DISABLED: "true"
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_TEST_EMAIL_ORG_B: ${{ secrets.E2E_TEST_EMAIL_ORG_B }}
      E2E_TEST_PASSWORD_ORG_B: ${{ secrets.E2E_TEST_PASSWORD_ORG_B }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Standing guard for IPI-897 planner default ACLs. Files are required on this
  # branch — missing migration/test fails the job instead of skipping.
  planner-default-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Seed insecure planner defaults, apply migration, run guard
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $roles$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin;
            end if;
            -- PUBLIC is a pseudo-role; has_*_privilege('public', ...) errors.
            -- ci_acl_probe is a real nologin role that only inherits PUBLIC grants.
            if not exists (select 1 from pg_roles where rolname = 'ci_acl_probe') then
              create role ci_acl_probe nologin nosuperuser;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'hyperdrive_mastra_runtime') then
              create role hyperdrive_mastra_runtime nologin nosuperuser;
            end if;
          end
          $roles$;
          create schema if not exists planner;
          create table if not exists planner.assignments (id int primary key);
          grant select on planner.assignments to authenticated;
          alter default privileges for role postgres in schema planner
            grant all on tables to anon, authenticated, public;
          alter default privileges for role postgres in schema planner
            grant all on sequences to anon, authenticated, public;
          do $pre$
          begin
            create table planner._ipi897_pre (id int primary key);
            if not has_table_privilege('anon', 'planner._ipi897_pre', 'insert')
               or not has_table_privilege('authenticated', 'planner._ipi897_pre', 'insert')
               or not has_table_privilege('ci_acl_probe', 'planner._ipi897_pre', 'insert') then
              raise exception 'CI seed failed: anon/authenticated/PUBLIC (via ci_acl_probe) should inherit INSERT before migration';
            end if;
            drop table planner._ipi897_pre;
          end
          $pre$;
          SQL
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260825095051_ipi897_revoke_planner_default_privileges.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260901183613_ipi1127_planner_thread_claims.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/default-planner-privileges.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/planner-thread-claims-acl.sql

  # IPI-1122 · SB-MEDIA-HARDEN-001 — media grants, shoot link, get_brand_assets revoke.
  media-harden-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        # Pin reviewed postgres 17 digest (mutable tag rejected on this job).
        image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Seed insecure media ACL, apply migration, run guards twice
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/media-harden-ci-seed.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260902223000_ipi1122_sb_media_harden.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260903120000_ipi1110_v2_shoot_owned_rpc.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/media-grants-acl.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/media-org-isolation.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/v2-shoot-owned-rpc.sql
          # Second pass (task requires targeted suite twice)
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/media-grants-acl.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/media-org-isolation.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/v2-shoot-owned-rpc.sql

  claim-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENAI_API_KEY: placeholder
      COPILOTKIT_TELEMETRY_DISABLED: "true"
      IPIX_CLAIM_CONCURRENCY: "1"
      MASTRA_DATABASE_URL: postgres://hyperdrive_mastra_runtime:runtime@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply claim table and grants
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists planner;
          do $roles$
          begin
            if not exists (select 1 from pg_roles where rolname = 'hyperdrive_mastra_runtime') then
              create role hyperdrive_mastra_runtime login password 'runtime';
            end if;
          end
          $roles$;
          grant connect on database postgres to hyperdrive_mastra_runtime;
          SQL
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260901183613_ipi1127_planner_thread_claims.sql
      - run: npm ci
      - run: npx vitest run tests/access-claim-001.test.ts

  # IPI-1111 · CLD-WEBHOOK-001 — RPC state-machine SQL fixture (idempotency / tenant).
  cloudinary-webhook-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Seed schema, apply migrations, run SQL fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/cloudinary/apply-cloudinary-ci-seed.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260903020000_ipi1111_apply_cloudinary_asset_event.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260905094610_ipi1111-schema-version-guard.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/cloudinary/apply-cloudinary-asset-events.sql

  # IPI-1147 · SPEC — Remove Unexpected Supabase Privileged Function Access and Prove Tenant-Safe RPCs
  sb-sec-010-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        # Pin reviewed postgres 17 digest (mutable tag rejected on this job).
        image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Seed insecure ACL, apply migration, run security regression
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1147-sb-sec-010-seed.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260904183041_ipi1147_sb_sec_010.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260904213817_ipi1147_sb_sec_010_search_path_fix.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/tests/security/ipi1147-sb-sec-010.sql

  # IPI-1162 · SB-MIG-003 — the actual acceptance criterion this task exists
  # to prove: a genuinely fresh Postgres (not a hand-seeded bare container,
  # unlike every job above) replays the full recovered migration chain via
  # the real `supabase start` + `db reset --local` path, then a fixed set of
  # schema/RLS/RPC assertions confirms the result. DB-only — no app E2E
  # needed for a migration-history task.
  #
  # CLI pinned to 2.116.0, not "latest": supabase/cli#6347 is an open
  # regression in 2.115.0/2.116.0 where a pipelined migration batch is not a
  # real transaction block, so a bare LOCK TABLE statement fails 25P01. Two
  # migrations in this chain need an explicit BEGIN/COMMIT to work around it
  # (matching that issue's own suggested fix, not an invented workaround) —
  # pinning keeps this job from silently depending on that exact bug's
  # current behavior if a future CLI version changes how it's handled.
  supabase-fresh-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.116.0
      - run: supabase start
      - run: supabase db reset --local
      - name: Schema / RLS / RPC assertions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            missing_schema text;
            rls_gap_count int;
            planner_rpc_count int;
            leftover_shadow_count int;
          begin
            select string_agg(s, ', ') into missing_schema
            from unnest(array['public','planner','mastra','shoot','talent']) s
            where not exists (select 1 from pg_namespace where nspname = s);
            if missing_schema is not null then
              raise exception 'fresh replay missing schema(s): %', missing_schema;
            end if;

            select count(*) into rls_gap_count
            from pg_class c
            join pg_namespace n on n.oid = c.relnamespace
            where n.nspname in ('public','planner','mastra','shoot','talent')
              and c.relkind = 'r'
              and not c.relrowsecurity;
            if rls_gap_count > 0 then
              raise exception 'fresh replay: % table(s) without RLS enabled across the 5 schemas', rls_gap_count;
            end if;

            select count(*) into planner_rpc_count
            from pg_proc where pronamespace = 'public'::regnamespace and proname like 'planner_%';
            if planner_rpc_count < 10 then
              raise exception 'fresh replay: expected >= 10 planner_* RPCs, found %', planner_rpc_count;
            end if;

            select count(*) into leftover_shadow_count
            from pg_tables where schemaname = 'public' and tablename like 'mastra\_%' escape '\';
            if leftover_shadow_count <> 0 then
              raise exception 'fresh replay: % leftover public.mastra_* shadow table(s) after cutover', leftover_shadow_count;
            end if;

            if not exists (select 1 from pg_roles where rolname = 'hyperdrive_mastra_runtime') then
              raise exception 'fresh replay: hyperdrive_mastra_runtime role missing';
            end if;

            if not exists (select 1 from pg_trigger where tgname = 'on_auth_user_created' and tgrelid = 'auth.users'::regclass) then
              raise exception 'fresh replay: on_auth_user_created trigger missing on auth.users';
            end if;
          end $$;
          SQL

          # End-to-end proof, not just schema-level: a real signup on this
          # fresh database must actually produce a profiles row (the exact
          # bug this task's own review caught and fixed).
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (id, aud, role, email, email_confirmed_at, raw_app_meta_data, raw_user_meta_data, created_at, updated_at)
          values ('11111111-1111-4111-8111-111111111111','authenticated','authenticated','ci-fresh-replay@ipix.test',now(),'{"provider":"email"}'::jsonb,'{"full_name":"CI Fresh Replay"}'::jsonb,now(),now());
          do $$
          begin
            if not exists (select 1 from public.profiles where id = '11111111-1111-4111-8111-111111111111') then
              raise exception 'fresh replay: signup did not create a profiles row';
            end if;
          end $$;
          SQL
      - run: supabase stop
