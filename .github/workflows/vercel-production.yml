name: Vercel Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact CI-tested SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use repository Node version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Refuse stale main SHA
        id: latest
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          latest_sha="$(git rev-parse origin/main)"
          if [ "$TESTED_SHA" != "$latest_sha" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale CI SHA $TESTED_SHA; latest main is $latest_sha"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Check Actions Production ownership arm
        id: ownership
        if: steps.latest.outputs.deploy == 'true'
        shell: bash
        env:
          VERCEL_ACTIONS_PRODUCTION_ENABLED: ${{ vars.VERCEL_ACTIONS_PRODUCTION_ENABLED }}
        run: |
          if [ "$VERCEL_ACTIONS_PRODUCTION_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Actions Production ownership is not armed; existing Vercel Git integration remains authoritative."
          fi

      - name: Check Vercel deployment credential
        id: credentials
        if: steps.latest.outputs.deploy == 'true' && steps.ownership.outputs.enabled == 'true'
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN is not configured; keeping the existing Vercel Git integration as the Production owner."
          fi

      - name: Install pinned Vercel CLI
        if: steps.latest.outputs.deploy == 'true' && steps.ownership.outputs.enabled == 'true' && steps.credentials.outputs.configured == 'true'
        run: npm install --global vercel@59.23.1

      - name: Pull Production environment
        if: steps.latest.outputs.deploy == 'true' && steps.ownership.outputs.enabled == 'true' && steps.credentials.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build exact SHA for Production
        if: steps.latest.outputs.deploy == 'true' && steps.ownership.outputs.enabled == 'true' && steps.credentials.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy exact SHA to Production
        if: steps.latest.outputs.deploy == 'true' && steps.ownership.outputs.enabled == 'true' && steps.credentials.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          latest_sha="$(git rev-parse origin/main)"
          if [ "$TESTED_SHA" != "$latest_sha" ]; then
            echo "Skipping deploy: tested SHA $TESTED_SHA is no longer latest main ($latest_sha)."
            exit 0
          fi
          vercel deploy --prebuilt --prod \
            --meta githubCommitSha="$TESTED_SHA" \
            --meta githubCommitRef=main \
            --token="$VERCEL_TOKEN"
