name: Codacy Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codacy-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate LCOV coverage
        run: npm run test:coverage -- --coverage.reporter=lcov
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ""
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
          OPENAI_API_KEY: ""
      - name: Install verified Codacy coverage reporter
        env:
          CODACY_REPORTER_VERSION: "14.1.3"
          CODACY_REPORTER_SHA256: "15c5f052207d27b8501ab5d5910c68c206ea70b0157ee1725132780530580875"
        run: |
          REPORTER="$RUNNER_TEMP/codacy-coverage-reporter"
          curl -fsSL \
            "https://github.com/codacy/codacy-coverage-reporter/releases/download/${CODACY_REPORTER_VERSION}/codacy-coverage-reporter-linux" \
            -o "$REPORTER"
          echo "${CODACY_REPORTER_SHA256}  ${REPORTER}" | sha256sum -c -
          chmod 0755 "$REPORTER"
      # One Vitest LCOV file spans JS + TS. Codacy requires one partial upload
      # per language, followed by a single final notification.
      - name: Upload Codacy coverage
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [[ -z "$CODACY_PROJECT_TOKEN" ]]; then
            echo "::warning::CODACY_PROJECT_TOKEN is unavailable; coverage was generated but not uploaded."
            exit 0
          fi
          REPORTER="$RUNNER_TEMP/codacy-coverage-reporter"
          "$REPORTER" report --partial -l Javascript -r coverage/lcov.info
          "$REPORTER" report --partial -l TypeScript -r coverage/lcov.info
          "$REPORTER" final
