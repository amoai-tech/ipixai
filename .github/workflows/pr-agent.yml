name: PR Agent

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted repository files for PR-Agent skills
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Select trusted PR-Agent skills
        id: reviewer-skills
        shell: bash
        run: |
          if [[ -e .claude/skills/mastra-review/SKILL.md && -e .claude/skills/copilotkit-review/SKILL.md ]]; then
            echo 'paths=["/github/workspace/.claude/skills/mastra-review","/github/workspace/.claude/skills/copilotkit-review"]' >> "$GITHUB_OUTPUT"
            echo 'max_tokens=8000' >> "$GITHUB_OUTPUT"
          else
            echo 'paths=["/github/workspace/.claude/skills/mastra"]' >> "$GITHUB_OUTPUT"
            echo 'max_tokens=3500' >> "$GITHUB_OUTPUT"
          fi

      - name: Review pull request
        uses: docker://pragent/pr-agent@sha256:548b760b81ab4b3f729182428695ccc1194bbf87528c2b1e2b2b07e5223af7b6
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_NIM_API_BASE: "https://integrate.api.nvidia.com/v1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.propagate_tool_errors: "true"
          skills.enabled: "true"
          skills.paths: ${{ steps.reviewer-skills.outputs.paths }}
          skills.max_skills_tokens: ${{ steps.reviewer-skills.outputs.max_tokens }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
