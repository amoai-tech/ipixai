name: PR Agent

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout trusted repository files for PR-Agent skills
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Review pull request
        uses: docker://pragent/pr-agent@sha256:548b760b81ab4b3f729182428695ccc1194bbf87528c2b1e2b2b07e5223af7b6
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_NIM_API_BASE: "https://integrate.api.nvidia.com/v1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          config.propagate_tool_errors: "true"
          pr_reviewer.extra_instructions: |-
            Act as a forensic senior engineer reviewing production iPix code.

            Prioritize only material findings: correctness defects; security and tenant-isolation defects; authorization/RLS failures; data integrity or migration failures; CI/build/test failures; broken error/retry/idempotency behavior; Mastra workflow/HITL/persistence defects; CopilotKit/AG-UI runtime regressions; Cloudinary webhook/signing/media integrity defects; payment or publishing safety defects; and missing deterministic verification for high-risk changes.

            Do not report style-only suggestions, subjective preferences, speculative problems without a realistic failure scenario, or issues unrelated to changed code.

            Use `changes_required` only when at least one material finding proves a changed-code defect, violated safety/compatibility invariant, failed required deterministic proof, or realistic failure scenario that must be fixed before merge. If there is no such finding, do not return `changes_required`. Keep advisory observations out of `key_issues_to_review`.

            Do not flag the intentional trusted-base checkout used for reviewer skills as a defect: loading `SKILL.md` from `github.event.pull_request.base.sha` is the security boundary that prevents a PR from rewriting its own reviewer instructions. For dependency upgrades, do not create a finding that merely says to verify a changelog or documentation; require concrete incompatibility evidence, a violated pinned-family invariant, or missing required proof for a material risk.

            For EVERY finding, structure issue_content exactly with these sections:
            Severity: BLOCKER | HIGH | MEDIUM | LOW
            Problem: State the concrete defect in plain English.
            Why it matters: Describe the actual user, security, data, CI, or production consequence.
            Evidence: Identify the changed code/config/invariant that proves the concern. Do not invent repository state that is not visible.
            Failure scenario: Describe the smallest realistic sequence that triggers the problem.
            Fix: Give the smallest safe implementation fix. Prefer existing repository patterns or official functionality over new architecture.
            Verification: Give the cheapest decisive test or command proving the fix. Use existing repository scripts/commands when known. Never invent a command unsupported by repository context.
            Expected result: State what observable result proves the defect is fixed.

            For BLOCKER or HIGH findings, explain why the PR must not merge before resolution, include Org A vs Org B verification when authorization/RLS is involved, and include exact-head CI/runtime proof when relevant. Rank findings by severity and production impact. Return at most 6 material findings.
          skills.enabled: "true"
          skills.paths: '["/github/workspace/.claude/skills/mastra"]'
          skills.max_skills_tokens: "8000"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
